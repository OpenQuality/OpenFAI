<a href="{% url url %}" class="text-decoration-none">
    <div class="card border-{{ variant|default:'primary' }} h-100" style="min-width: 130px; max-width: 150px;">
        <div class="card-body text-center p-2">
            <i class="bi {{ icon }} text-{{ variant|default:'primary' }}" style="font-size: 1.4rem;"></i>
            <div class="fw-semibold small mt-1 text-dark">{{ title }}</div>
            <div class="text-muted" style="font-size: 0.72rem;">{{ desc }}</div>
        </div>
    </div>
</a>
